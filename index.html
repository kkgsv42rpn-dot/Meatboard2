<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baruch's Boards</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4efe6;
    color:#29251f;
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}


/* =====================================================
   NAV
===================================================== */

nav{
    position:fixed;
    z-index:100;

    top:0;
    left:0;

    width:100%;
    height:78px;

    padding:0 5vw;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Playfair Display",serif;

    font-size:21px;
    font-weight:700;

    letter-spacing:.13em;
}

.nav-button{
    text-decoration:none;

    color:#29251f;

    padding:11px 22px;

    border:1px solid rgba(41,37,31,.28);

    border-radius:30px;

    font-size:13px;

    background:rgba(244,239,230,.65);

    backdrop-filter:blur(12px);

    transition:.3s;
}

.nav-button:hover{
    background:#29251f;
    color:white;
}


/* =====================================================
   CINEMATIC HERO
===================================================== */

.hero{
    height:400vh;
}

.hero-sticky{
    position:sticky;

    top:0;

    width:100%;
    height:100vh;

    overflow:hidden;

    perspective:1800px;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.9),
            transparent 43%
        ),
        #f4efe6;
}


/* =====================================================
   BRAND
===================================================== */

.brand{
    position:absolute;

    z-index:50;

    top:8vh;
    left:50%;

    transform:translateX(-50%);

    font-family:"Playfair Display",serif;

    font-size:clamp(20px,2.7vw,38px);

    letter-spacing:.13em;

    white-space:nowrap;
}


/* =====================================================
   3D SCENE
===================================================== */

.scene{
    position:absolute;

    inset:0;

    transform-style:preserve-3d;
}


/* =====================================================
   BOARD CONTAINER
===================================================== */

.board-world{
    position:absolute;

    width:min(1050px,92vw);

    left:50%;
    top:57%;

    transform-style:preserve-3d;

    will-change:transform;

    z-index:10;
}


/* =====================================================
   ORIGINAL BOARD
===================================================== */

.board-base{
    width:100%;

    display:block;

    border-radius:28px;

    box-shadow:
        0 90px 130px rgba(48,31,18,.32),
        0 30px 50px rgba(48,31,18,.20);

    transition:filter .2s;
}


/* =====================================================
   MEAT PIECES

   These are portions of the EXACT uploaded photograph.
   They separate from the board as you scroll.
===================================================== */

.piece{
    position:absolute;

    z-index:20;

    overflow:hidden;

    pointer-events:none;

    opacity:0;

    transform-style:preserve-3d;

    will-change:transform,opacity;

    border-radius:18px;

    box-shadow:
        0 25px 45px rgba(35,22,13,.25);
}


/*
   Every piece uses the same photograph.

   Background size is calculated so the crop lines
   up with the original board.
*/

.piece::after{
    content:"";

    position:absolute;

    inset:0;

    background-image:url("meat-board.jpg");

    background-repeat:no-repeat;

    background-size:100% 100%;
}


/* =====================================================
   LEFT MEAT
===================================================== */

.piece-left{
    left:1%;
    top:25%;

    width:31%;
    height:35%;

    clip-path:polygon(
        0 5%,
        100% 0,
        98% 92%,
        5% 100%
    );
}

.piece-left::after{
    background-position:0 0;
}


/* =====================================================
   CENTER TOP MEAT
===================================================== */

.piece-top{
    left:31%;
    top:9%;

    width:38%;
    height:32%;

    clip-path:polygon(
        4% 0,
        97% 2%,
        100% 94%,
        0 100%
    );
}

.piece-top::after{
    background-position:0 0;
}


/* =====================================================
   RIGHT MEAT
===================================================== */

.piece-right{
    right:1%;
    top:13%;

    width:39%;
    height:46%;

    clip-path:polygon(
        5% 0,
        100% 4%,
        96% 98%,
        0 92%
    );
}

.piece-right::after{
    background-position:0 0;
}


/* =====================================================
   CENTER MEAT
===================================================== */

.piece-center{
    left:27%;
    top:36%;

    width:43%;
    height:39%;

    clip-path:polygon(
        2% 5%,
        96% 0,
        100% 94%,
        5% 100%
    );
}

.piece-center::after{
    background-position:0 0;
}


/* =====================================================
   BOTTOM LEFT
===================================================== */

.piece-bottom-left{
    left:2%;
    bottom:2%;

    width:38%;
    height:34%;

    clip-path:polygon(
        0 5%,
        96% 0,
        100% 94%,
        5% 100%
    );
}

.piece-bottom-left::after{
    background-position:0 0;
}


/* =====================================================
   BOTTOM CENTER
===================================================== */

.piece-bottom{
    left:31%;
    bottom:0;

    width:39%;
    height:31%;

    clip-path:polygon(
        3% 0,
        100% 5%,
        96% 100%,
        0 94%
    );
}

.piece-bottom::after{
    background-position:0 0;
}


/* =====================================================
   EXTRA RIGHT PIECE
===================================================== */

.piece-right-bottom{
    right:1%;
    bottom:4%;

    width:35%;
    height:31%;

    clip-path:polygon(
        4% 0,
        100% 5%,
        95% 100%,
        0 94%
    );
}

.piece-right-bottom::after{
    background-position:0 0;
}


/* =====================================================
   BOARD SHADOW
===================================================== */

.board-shadow{
    position:absolute;

    z-index:-5;

    left:8%;
    right:8%;

    bottom:-18%;

    height:25%;

    border-radius:50%;

    background:rgba(42,27,16,.3);

    filter:blur(35px);

    opacity:0;
}


/* =====================================================
   LIGHT GLOW
===================================================== */

.glow{
    position:absolute;

    z-index:-10;

    inset:-20%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,239,204,.65),
            transparent 65%
        );

    filter:blur(40px);
}


/* =====================================================
   SCROLL MESSAGE
===================================================== */

.scroll-message{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    font-size:10px;

    letter-spacing:.25em;

    text-transform:uppercase;

    color:#777066;

    z-index:60;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress{
    position:fixed;

    z-index:100;

    right:25px;
    top:50%;

    width:2px;
    height:120px;

    background:rgba(40,35,30,.14);
}

.progress-fill{
    width:100%;
    height:0;

    background:#433c34;
}


/* =====================================================
   CONTENT
===================================================== */

.section{
    min-height:100vh;

    padding:130px 8vw;

    display:flex;
    align-items:center;
}

.section-inner{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.section-title{
    font-family:"Playfair Display",serif;

    font-size:clamp(48px,6vw,82px);

    line-height:1;
}

.section-text{
    margin-top:28px;

    max-width:560px;

    color:#665e55;

    font-size:18px;

    line-height:1.7;
}


/* =====================================================
   CARDS
===================================================== */

.cards{
    margin-top:70px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:25px;
}

.card{
    min-height:280px;

    padding:35px;

    border-radius:25px;

    background:#e7dece;

    transition:.4s;
}

.card:hover{
    transform:translateY(-10px);
}

.card-number{
    color:#74806c;

    font-size:11px;

    letter-spacing:.2em;
}

.card-title{
    margin-top:65px;

    font-family:"Playfair Display",serif;

    font-size:31px;
}


/* =====================================================
   CTA
===================================================== */

.cta{
    background:#ddd3c2;

    justify-content:center;

    text-align:center;
}

.cta-title{
    font-family:"Playfair Display",serif;

    font-size:clamp(50px,7vw,90px);

    line-height:.95;
}

.button{
    display:inline-block;

    margin-top:40px;

    padding:17px 32px;

    border-radius:40px;

    background:#29251f;

    color:white;

    text-decoration:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .hero{
        height:350vh;
    }

    .brand{
        top:8vh;
        font-size:19px;
    }

    .board-world{
        width:120vw;
        top:60%;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .section{
        padding:100px 25px;
    }

    .progress{
        right:12px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     NAV
===================================================== -->

<nav>

    <div class="logo">
        BARUCH'S BOARDS
    </div>

    <a
        href="#contact"
        class="nav-button"
    >
        Build Yours
    </a>

</nav>


<!-- =====================================================
     PROGRESS
===================================================== -->

<div class="progress">

    <div
        class="progress-fill"
        id="progress"
    ></div>

</div>


<!-- =====================================================
     CINEMATIC HERO
===================================================== -->

<section class="hero">

    <div class="hero-sticky">


        <div class="brand">
            BARUCH'S BOARDS
        </div>


        <div class="scene">


            <div class="board-world" id="board">


                <div class="glow"></div>


                <!-- ==========================================
                     REAL BOARD IMAGE
                ========================================== -->

                <img
                    src="meat-board.jpg"
                    class="board-base"
                    id="baseBoard"
                    alt="Baruch's Board"
                >


                <!-- ==========================================
                     FLOATING COMPONENTS
                ========================================== -->


                <div
                    class="piece piece-left"
                    id="piece1"
                ></div>


                <div
                    class="piece piece-top"
                    id="piece2"
                ></div>


                <div
                    class="piece piece-right"
                    id="piece3"
                ></div>


                <div
                    class="piece piece-center"
                    id="piece4"
                ></div>


                <div
                    class="piece piece-bottom-left"
                    id="piece5"
                ></div>


                <div
                    class="piece piece-bottom"
                    id="piece6"
                ></div>


                <div
                    class="piece piece-right-bottom"
                    id="piece7"
                ></div>


                <div
                    class="board-shadow"
                    id="shadow"
                ></div>


            </div>

        </div>


        <div class="scroll-message">
            Scroll
        </div>

    </div>

</section>


<!-- =====================================================
     SECOND SECTION
===================================================== -->

<section class="section">

    <div class="section-inner">

        <h2 class="section-title">
            Made for the<br>
            middle of the table.
        </h2>

        <p class="section-text">
            Beautiful presentation designed to turn
            an ordinary table into the centerpiece
            of the occasion.
        </p>


        <div class="cards">


            <div class="card">

                <div class="card-number">
                    01
                </div>

                <div class="card-title">
                    Crafted
                </div>

            </div>


            <div class="card">

                <div class="card-number">
                    02
                </div>

                <div class="card-title">
                    Generous
                </div>

            </div>


            <div class="card">

                <div class="card-number">
                    03
                </div>

                <div class="card-title">
                    Memorable
                </div>

            </div>


        </div>

    </div>

</section>


<!-- =====================================================
     CTA
===================================================== -->

<section
    class="section cta"
    id="contact"
>

    <div class="section-inner">

        <div class="cta-title">
            Your table.<br>
            Your board.
        </div>

        <a
            class="button"
            href="mailto:hello@baruchsboards.com"
        >
            Build Your Board
        </a>

    </div>

</section>


<script>

/* =========================================================
   CINEMATIC SCROLL ENGINE
========================================================= */


const hero =
    document.querySelector(".hero");

const board =
    document.querySelector("#board");

const baseBoard =
    document.querySelector("#baseBoard");

const shadow =
    document.querySelector("#shadow");

const progress =
    document.querySelector("#progress");


const pieces = [

    document.querySelector("#piece1"),

    document.querySelector("#piece2"),

    document.querySelector("#piece3"),

    document.querySelector("#piece4"),

    document.querySelector("#piece5"),

    document.querySelector("#piece6"),

    document.querySelector("#piece7")

];


let target = 0;

let smooth = 0;


/* =========================================================
   SCROLL POSITION
========================================================= */

window.addEventListener(
    "scroll",
    () => {

        const rect =
            hero.getBoundingClientRect();

        const total =
            hero.offsetHeight -
            window.innerHeight;


        target =
            Math.max(
                0,
                Math.min(
                    1,
                    -rect.top / total
                )
            );

    },
    {
        passive:true
    }
);


/* =========================================================
   PIECE SETTINGS
========================================================= */

const pieceSettings = [

    /*
        x,
        y,
        z,
        rotation,
        delay
    */

    [-120,-260,420,-18,.00],

    [30,-360,520,15,.05],

    [160,-300,430,-14,.10],

    [-20,-420,600,20,.16],

    [-150,-220,390,-17,.22],

    [30,-290,470,12,.28],

    [160,-230,360,-10,.34]

];


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    /*
        Smooth scrolling.
    */

    smooth +=
        (target-smooth) *
        .055;


    const p =
        smooth;


    /* =====================================================
       MAIN BOARD

       It begins floating and tilted,
       then slowly settles.
    ===================================================== */


    const boardZ =
        -850 +
        p * 650;


    const boardY =
        -3 +
        p * 8;


    const boardRotate =
        32 -
        p * 32;


    const boardScale =
        .60 +
        p * .40;


    board.style.transform =

        "translate(-50%,-50%) " +

        "translate3d(" +

        "0," +

        boardY +

        "vh," +

        boardZ +

        "px)" +

        "rotateX(" +

        boardRotate +

        "deg)" +

        "rotateZ(-4deg)" +

        "scale(" +

        boardScale +

        ")";


    /* =====================================================
       THE MEAT LIFT

       0.00 → 0.20
       Board is together.

       0.20 → 0.55
       Pieces rise into the air.

       0.55 → 1.00
       Pieces slowly return to the board.
    ===================================================== */


    let liftProgress;


    if(p < .18){

        liftProgress = 0;

    }

    else if(p < .58){

        liftProgress =
            (p-.18)/.40;

    }

    else{

        liftProgress =
            1-((p-.58)/.42);

    }


    liftProgress =
        Math.max(
            0,
            Math.min(
                1,
                liftProgress
            )
        );


    /*
        Smooth easing.
    */

    const eased =
        liftProgress < .5

        ?

        2 *
        liftProgress *
        liftProgress

        :

        1 -
        Math.pow(
            -2 *
            liftProgress +
            2,
            2
        ) / 2;


    /* =====================================================
       INDIVIDUAL MEAT PIECES
    ===================================================== */


    pieces.forEach(
        (piece,index) => {

            const settings =
                pieceSettings[index];


            const startX =
                settings[0];

            const startY =
                settings[1];

            const startZ =
                settings[2];

            const startRotation =
                settings[3];

            const delay =
                settings[4];


            /*
                Delay each piece slightly.

                This creates a cascading
                "pieces floating apart" effect.
            */

            const local =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (eased-delay) /
                        (1-delay)
                    )
                );


            /*
                Lift away from the board.
            */

            const x =
                startX * local;

            const y =
                startY * local;

            const z =
                startZ * local;


            /*
                Rotate while floating.
            */

            const rotation =
                startRotation *
                local;


            /*
                Slight additional tilt.
            */

            const rotateY =
                Math.sin(
                    local * Math.PI
                ) * 12;


            piece.style.opacity =
                local > .01
                ? "1"
                : "0";


            piece.style.transform =

                "translate3d(" +

                x +
                "px," +

                y +
                "px," +

                z +
                "px)" +

                "rotateX(" +

                rotation +

                "deg)" +

                "rotateY(" +

                rotateY +

                "deg)" +

                "rotateZ(" +

                rotation*.4 +

                "deg)";


            /*
                Shadow under the floating pieces.
            */

        }
    );


    /* =====================================================
       BOARD SHADOW
    ===================================================== */

    const shadowOpacity =
        .15 +
        p*.5;


    shadow.style.opacity =
        shadowOpacity;


    /* =====================================================
       ORIGINAL IMAGE

       Slightly fades while the individual pieces
       are floating, then becomes completely solid
       again when everything lands.
    ===================================================== */

    let baseOpacity;


    if(p < .18){

        baseOpacity = 1;

    }

    else if(p < .58){

        baseOpacity =
            1 -
            ((p-.18)/.40)*.55;

    }

    else{

        baseOpacity =
            .45 +
            ((p-.58)/.42)*.55;

    }


    baseBoard.style.opacity =
        baseOpacity;


    /* =====================================================
       PROGRESS
    ===================================================== */

    progress.style.height =
        (p*100) +
        "%";


    requestAnimationFrame(
        animate
    );

}


animate();


/* =========================================================
   MOUSE PARALLAX
========================================================= */

window.addEventListener(
    "mousemove",
    event => {

        if(
            window.innerWidth < 700
        ){

            return;

        }


        const mouseX =
            event.clientX /
            window.innerWidth -
            .5;


        const mouseY =
            event.clientY /
            window.innerHeight -
            .5;


        board.style.marginLeft =
            mouseX * 18 +
            "px";


        board.style.marginTop =
            mouseY * 12 +
            "px";

    }
);

</script>

</body>
</html>
